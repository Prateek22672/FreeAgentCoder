<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Segoe UI, system-ui, sans-serif">
  <style>
    .frame { fill: var(--vscode-editor-background, #1f1f1f); stroke: var(--vscode-foreground, #cccccc); stroke-opacity: 0.35; }
    .bar { fill: var(--vscode-foreground, #cccccc); fill-opacity: 0.08; }
    .line { fill: var(--vscode-foreground, #cccccc); fill-opacity: 0.22; }
    .dim { fill: var(--vscode-foreground, #cccccc); fill-opacity: 0.6; font-size: 11px; }
    .label { fill: var(--vscode-foreground, #cccccc); font-size: 12px; font-weight: 600; }
    .accent { fill: #d97757; }
    .ring { fill: none; stroke: #d97757; stroke-width: 2.5; }
    .chat { fill: #d97757; fill-opacity: 0.12; stroke: #d97757; stroke-opacity: 0.5; }
  </style>
  <!-- The window -->
  <rect class="frame" x="10" y="10" width="460" height="280" rx="10"/>
  <rect class="bar" x="10" y="10" width="460" height="26" rx="10"/>
  <!-- Activity bar on the left, with our icon -->
  <rect class="bar" x="10" y="36" width="34" height="230"/>
  <rect class="line" x="19" y="50" width="16" height="16" rx="3"/>
  <rect class="line" x="19" y="78" width="16" height="16" rx="3"/>
  <rect class="line" x="19" y="106" width="16" height="16" rx="3"/>
  <path class="accent" fill-rule="evenodd" transform="translate(17 132) scale(0.83)" d="M3 3h13v4H7v9H3zM21 21H8v-4h9V8h4zM10 10h4v4h-4z"/>
  <circle class="ring" cx="27" cy="142" r="15"/>
  <!-- The chat it opens -->
  <rect class="chat" x="44" y="36" width="130" height="230"/>
  <rect class="line" x="54" y="50" width="90" height="7" rx="3"/>
  <rect class="line" x="54" y="64" width="70" height="7" rx="3"/>
  <rect class="line" x="54" y="232" width="110" height="22" rx="6"/>
  <!-- Editor, with our button at its top right -->
  <rect class="bar" x="174" y="36" width="296" height="22"/>
  <rect class="line" x="184" y="43" width="60" height="8" rx="3"/>
  <path class="accent" fill-rule="evenodd" transform="translate(438 40) scale(0.6)" d="M3 3h13v4H7v9H3zM21 21H8v-4h9V8h4zM10 10h4v4h-4z"/>
  <circle class="ring" cx="445" cy="47" r="12"/>
  <rect class="line" x="190" y="74" width="180" height="7" rx="3"/>
  <rect class="line" x="190" y="90" width="140" height="7" rx="3"/>
  <rect class="line" x="190" y="106" width="200" height="7" rx="3"/>
  <!-- Status bar, with our item at the bottom right -->
  <rect class="bar" x="10" y="266" width="460" height="24"/>
  <text class="dim" x="364" y="282">◉ FreeAgentCoder</text>
  <rect class="ring" x="356" y="270" width="106" height="17" rx="8"/>
  <!-- Labels -->
  <text class="label" x="56" y="150">1  Left bar</text>
  <text class="label" x="300" y="150">2  Top right of any editor</text>
  <text class="dim" x="300" y="166">opens it as a tab</text>
  <text class="label" x="300" y="246">3  Bottom right</text>
</svg>
