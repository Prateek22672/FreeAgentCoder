name: Nightly benchmarks

# Every night, runs the Test lab benchmarks with the engine on free models,
# grades them automatically and sends the results to the admin Test lab, so
# the scorecard shows whether yesterday's changes helped or hurt.
# Needs the repository secrets LAB_TOKEN and at least one model key
# (GEMINI_API_KEY, GROQ_API_KEY, NVIDIA_API_KEY). Without LAB_TOKEN it skips.
on:
  schedule:
    - cron: '30 21 * * *' # 03:00 India time
  workflow_dispatch:
    inputs:
      task:
        description: 'One task id (empty for every benchmark)'
        required: false

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LAB_TOKEN: ${{ secrets.LAB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Skip without a lab token
        if: env.LAB_TOKEN == ''
        run: echo "LAB_TOKEN is not set; nothing to run."

      - uses: actions/checkout@v4
        if: env.LAB_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.LAB_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        if: env.LAB_TOKEN != ''
        with:
          python-version: '3.12'

      - name: Install
        if: env.LAB_TOKEN != ''
        run: |
          npm ci
          pip install python-pptx reportlab matplotlib pytest

      - name: Build the command line
        if: env.LAB_TOKEN != ''
        run: npm run build

      - name: Run the benchmarks
        if: env.LAB_TOKEN != ''
        env:
          TASK: ${{ github.event.inputs.task }}
        run: node packages/cli/dist/agentic.js lab ${TASK:+--task "$TASK"}
