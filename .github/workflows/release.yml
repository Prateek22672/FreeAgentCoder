name: Release extension

# Push a tag like v0.1.0 to package the extension, publish it to the
# VS Code Marketplace and Open VSX, and attach the .vsix to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npm ci --prefix freeagentcoder

      - name: Test the engine
        run: npx vitest run

      - name: Package
        working-directory: freeagentcoder
        run: npx --yes @vscode/vsce package --no-dependencies --out freeagentcoder.vsix

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: freeagentcoder
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath freeagentcoder.vsix

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: freeagentcoder
        run: npx --yes ovsx publish freeagentcoder.vsix

      - name: Attach the .vsix to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: freeagentcoder/freeagentcoder.vsix
          generate_release_notes: true
